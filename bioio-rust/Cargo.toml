[package]
name = "bioio-rust"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "High-performance microscopy image I/O library"
repository = "https://github.com/derekthirstrup/bioio-rust"
keywords = ["microscopy", "imaging", "tiff", "nd2", "bioimaging"]
categories = ["science", "multimedia::images"]
rust-version = "1.75"

[lib]
name = "bioio_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Python bindings
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"

# Array handling
ndarray = { version = "0.16", features = ["rayon"] }

# Parallelism
rayon = "1.10"
crossbeam = "0.8"

# TIFF format
tiff = "0.9"

# Compression
flate2 = "1.0"
lzw = { version = "0.10", package = "weezl" }
zstd = "0.13"
lz4_flex = "0.11"

# Image decoding
jpeg-decoder = "0.3"
png = "0.17"

# ND2/binary parsing
byteorder = "1.5"
memmap2 = "0.9"

# XML parsing (OME metadata)
quick-xml = "0.36"
roxmltree = "0.20"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
thiserror = "2.0"
parking_lot = "0.12"
smallvec = "1.13"
log = "0.4"
env_logger = "0.11"

# Async for potential future use
tokio = { version = "1", features = ["fs", "io-util"], optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.14"
rand = "0.8"
approx = "0.5"

[features]
default = []
async = ["tokio"]

[[bench]]
name = "readers"
harness = false

[[bench]]
name = "parallel"
harness = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"

[profile.bench]
lto = true
codegen-units = 1
opt-level = 3
